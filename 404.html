<!-- 404.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#c17f24" />
  <meta name="color-scheme" content="dark" />
  <title>Página não encontrada — Fator de Corte</title>
  <link rel="stylesheet" href="css/index.css" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <style>
    .not-found {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: var(--space-4);
      padding: var(--space-6);
    }

    .not-found-code {
      font-size: 5rem;
      font-weight: var(--font-bold);
      background: linear-gradient(135deg, var(--color-amber-light) 0%, var(--color-amber-bright) 40%, var(--color-cream) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }

    .not-found-text {
      color: var(--color-text-secondary);
      max-width: 32rem;
    }
  </style>
</head>
<body>
  <div class="not-found">
    <span class="not-found-code" aria-hidden="true">404</span>
    <h1>Página não encontrada</h1>
    <p class="not-found-text">O corte que você procura não está nessa carcaça. A página não existe ou foi movida.</p>
    <a href="./" class="btn btn-primary">Voltar para o Fator de Corte</a>
  </div>
</body>
</html>
