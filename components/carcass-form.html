<!-- components/carcass-form.html -->
<section class="card section" aria-labelledby="carcass-form-title">
  <div class="card-header">
    <svg class="icon card-icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="3" x2="12" y2="21"/><line x1="5" y1="7" x2="19" y2="7"/><path d="M5 7 2 13a3 3 0 0 0 6 0L5 7Z"/><path d="M19 7l-3 6a3 3 0 0 0 6 0l-3-6Z"/><line x1="9" y1="21" x2="15" y2="21"/></svg>
    <h2 class="card-title" id="carcass-form-title">Dados da Carcaça</h2>
  </div>

  <form id="carcass-form" novalidate>
    <div class="form-row">

      <div class="form-group">
        <span class="form-label form-label-required" id="carcass-type-label">
          Tipo de Carcaça
        </span>
        <div id="carcass-type" class="custom-select">
          <button
            type="button"
            class="custom-select-trigger form-input"
            role="combobox"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="carcass-type-listbox"
            aria-labelledby="carcass-type-label"
            aria-describedby="carcass-type-hint"
          >
            <span class="custom-select-value" data-placeholder="Selecione" data-empty="true">Selecione</span>
          </button>
          <ul
            class="custom-select-listbox"
            id="carcass-type-listbox"
            role="listbox"
            aria-labelledby="carcass-type-label"
            inert
          >
            <li class="custom-select-option" role="option" id="carcass-type-opt-traseiro" data-value="traseiro" aria-selected="false">Traseiro</li>
            <li class="custom-select-option" role="option" id="carcass-type-opt-dianteiro" data-value="dianteiro" aria-selected="false">Dianteiro</li>
            <li class="custom-select-option" role="option" id="carcass-type-opt-ponta-de-agulha" data-value="ponta-de-agulha" aria-selected="false">Ponta de Agulha</li>
            <li class="custom-select-option" role="option" id="carcass-type-opt-suinos" data-value="suinos" aria-selected="false">Suínos</li>
          </ul>
        </div>
        <span class="form-hint" id="carcass-type-hint">Tipo de corte da carcaça</span>
      </div>

      <div class="form-group">
        <label class="form-label form-label-required" for="target-margin">
          Margem Desejada
        </label>
        <div class="input-group">
          <input
            type="number"
            id="target-margin"
            class="form-input"
            value="30"
            min="0.01"
            max="99.99"
            step="0.01"
            inputmode="decimal"
            required
            aria-describedby="target-margin-hint"
          />
          <span class="input-suffix">%</span>
        </div>
        <span class="form-hint" id="target-margin-hint">Margem de lucro desejada</span>
      </div>

      <div class="form-group">
        <label class="form-label form-label-required" for="carcass-weight">
          Peso da Carcaça
        </label>
        <div class="input-group">
          <input
            type="number"
            id="carcass-weight"
            class="form-input"
            placeholder="0.000"
            min="0"
            step="0.001"
            inputmode="decimal"
            aria-describedby="carcass-weight-hint"
          />
          <span class="input-suffix">kg</span>
        </div>
        <span class="form-hint" id="carcass-weight-hint">Peso total da carcaça em kg</span>
      </div>

      <div class="form-group">
        <label class="form-label form-label-required" for="carcass-price">
          Preço de Compra/kg
        </label>
        <div class="input-group">
          <span class="input-prefix">R$</span>
          <input
            type="number"
            id="carcass-price"
            class="form-input"
            placeholder="0.00"
            min="0"
            step="0.01"
            inputmode="decimal"
            aria-describedby="carcass-price-hint"
          />
        </div>
        <span class="form-hint" id="carcass-price-hint">Preço pago por kg da carcaça</span>
      </div>

    </div>
  </form>
</section>
